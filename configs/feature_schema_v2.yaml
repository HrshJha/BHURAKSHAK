# BhuRakshak — feature schema v2 (label-blind, provenance gated; //)
feature_schema_version: "v2"
dataset_version: "synthetic-v2-label-blind"
provenance_registry: "configs/feature_provenance.yaml"
spatial_gate:
  gated: true
  gate_reason: "single-node events, no co-temporal neighbours"
  features:
    - neighbor_mean
    - neighbor_std
    - neighbor_anomaly_fraction
    - spatial_coherence
    - local_gradient
    - local_strain
    - hotspot_density
    - distance_to_subsidence_center

# Explicit dimensional contracts for temporal-rate terms.
units:
  B_temporal:
    tilt_x_velocity: degree/hour
    tilt_y_velocity: degree/hour
    velocity: mm/hour
    tilt_x_acceleration: degree/hour^2
    tilt_y_acceleration: degree/hour^2
    acceleration: mm/hour^2
  G_dgps:
    velocity: mm/year
    acceleration: mm/year^2
  H_insar:
    LOS_velocity: mm/day
    LOS_acceleration: mm/day^2
  dataset_fields:
    tilt_velocity: degree/hour
    tilt_acceleration: degree/hour^2
    displacement_velocity: mm/hour
    displacement_acceleration: mm/hour^2

# dataset schema — exact field list
dataset_fields:
  - timestamp
  - node_id
  - x
  - y
  - tilt_x
  - tilt_y
  - tilt_magnitude
  - displacement
  - strain
  - tilt_velocity
  - tilt_acceleration
  - displacement_velocity
  - displacement_acceleration
  - vibration_rms
  - vibration_peak
  - neighbor_mean
  - neighbor_std
  - neighbor_anomaly_fraction
  - spatial_coherence
  - battery
  - RSSI
  - SNR
  - packet_loss
  - DGPS_displacement
  - DGPS_velocity
  - InSAR_displacement
  - InSAR_velocity
  - InSAR_coherence
  - physics_displacement
  - physics_residual
  - anomaly_score
  - progression_label
  - risk_label

# feature groups A–J (feature names exactly as listed in the table)
feature_groups:
  A_physical:
    - tilt_x
    - tilt_y
    - tilt_magnitude
    - displacement
    - strain
  B_temporal:
    - rolling_mean
    - rolling_std
    - rolling_min
    - rolling_max
    - slope
    - velocity
    - acceleration
    - trend
    - persistence
    - change_point_score
    # per-channel expansions actually emitted by the windowing engine
    # (every emitted column is declared to prevent schema drift)
    - tilt_x_rolling_mean
    - tilt_x_rolling_std
    - tilt_x_rolling_min
    - tilt_x_rolling_max
    - tilt_x_slope
    - tilt_x_velocity
    - tilt_x_acceleration
    - tilt_x_trend
    - tilt_x_persistence
    - tilt_x_change_point_score
    - tilt_y_rolling_mean
    - tilt_y_rolling_std
    - tilt_y_rolling_min
    - tilt_y_rolling_max
    - tilt_y_slope
    - tilt_y_velocity
    - tilt_y_acceleration
    - tilt_y_trend
    - tilt_y_persistence
    - tilt_y_change_point_score
  C_spatial:
    - neighbor_mean
    - neighbor_std
    - neighbor_anomaly_fraction
    - spatial_coherence
    - local_gradient
    - local_strain
    - hotspot_density
    - distance_to_subsidence_center
  D_vibration:
    - vibration_rms
    - vibration_peak
    - crest_factor
    - band_energy_low
    - band_energy_mid
    - band_energy_high
    - spectral_centroid
  E_sensor_health:
    - battery
    - RSSI
    - SNR
    - packet_loss
    - missing_ratio
    - stuck_sensor_flag
    - drift_score
  F_physics:
    - expected_displacement
    - expected_tilt
    - physics_residual
    - physics_residual_velocity
  G_dgps:
    - vertical_displacement
    - horizontal_displacement
    - velocity
    - acceleration
    - mesh_vs_dgps_residual
  H_insar:
    - LOS_displacement
    - LOS_velocity
    - LOS_acceleration
    - cumulative_displacement
    - coherence
    - spatial_gradient
    - local_hotspot_density
  I_terrain:
    - elevation
    - slope
    - aspect
    - curvature
    - mine_depth
    - panel_distance
    - panel_geometry
    - overburden
  J_environmental:
    features:
      - rainfall
      - temperature
      - land_surface_temperature
      - land_cover
    #: Group J included ONLY if an ablation shows predictive value
    enabled_by_default: false
    gate: ablation_required

# target budget for the first model iteration
# Gated groups: declared in the schema but intentionally absent
# from the default feature store, with the reason. The drift guard
# (src/features/schema_guard.py) treats these as allowed-absent.
gates:
  C_spatial:
    gated: true
    gate_reason: "single-node events, no co-temporal neighbours;  spatial confirmation cannot be validated on this corpus"
  G_dgps:
    gated: true
    gate_reason: "Phase-4 modality — ablation-gated per / (); no real DGPS feed exists (Gap ); synthetic DGPS only in notebook 09"
  H_insar:
    gated: true
    gate_reason: "Phase-4 modality — ablation-gated per / (); joined per-node in arm F via enrich_with_insar, not part of the default store"
  I_terrain:
    gated: true
    gate_reason: ": no real DEM/mine survey in MVP scope; synthetic terrain only, gate closed pending real source"
  J_environmental:
    gated: true
    gate_reason: "Environmental ablation gate (/, ): adopt only if the ablation shows a measured operational improvement — currently CLOSED"

model_input_budget:
  min: 40
  max: 70
  first_iteration_groups: [A_physical, B_temporal, C_spatial, D_vibration, E_sensor_health, F_physics]
