# SubSense — preprocessing config (PRD §9, §9.1, §8.4, §10)
# NFR-6: every operational threshold used by src/preprocessing and src/features
# lives here, never in code.

# §10 / T-034 — windowing for XGBoost (also reconciles Gap G-4: 10,000
# sequences × 144 steps with window=60/stride=10 → ~120k windows, inside
# §15's 100k–500k budget).
windowing:
  window_steps: 60
  stride: 10

# §9.1 — feature windows are built on a fixed grid anchored at the first
# observation of each series.
resampling:
  grid_interval_minutes: 10        # §8.3 default mesh cadence
  match_tolerance_fraction: 0.5    # nearest-neighbour match within ±0.5× interval
  max_interpolatable_gap_steps: 3  # linear interpolation ONLY for single-sample gaps;
                                   # gaps longer than 3 missed samples become DATA_QUALITY flags

# §9.1 — node clock drift: node-stamp vs gateway receipt-stamp, estimated per
# node, applied at feature-generation time, and LOGGED (never silently absorbed).
clock_drift:
  min_samples_for_estimate: 20     # (node, receipt) pairs required before an offset is trusted
  max_abs_offset_seconds: 30.0     # offsets beyond this are flagged, not applied

# §9.1 — cross-modality alignment: async modalities join the nearest sensor
# feature window by timestamp, keeping their own observation timestamp.
align_modalities:
  insar_tolerance_hours: 12.0      # Sentinel-1 passes
  dgps_tolerance_hours: 1.0        # DGPS campaigns

# §8.4 item 6 / §9 — sensor-health state detection thresholds.
# Statistics (see src/preprocessing/sensor_health.py): trend significance |t|
# (noise ~ N(0,1)) and window-median level shift in σ units; per-sample σ from
# robust first differences. Empirically |t| ≈ 5.4 × jump for a step, ≈ 16 × jump
# for a ramp — the ratio separates the two shapes.
sensor_health:
  drift_score_threshold: 3.5       # trend |t| ⇒ DRIFT (false-flag < 0.05% under noise)
  stuck_value_tolerance: 1.0e-9    # consecutive identical readings ⇒ STUCK
  stuck_min_repeats: 5             # repeats required before a run counts as stuck
  offset_jump_sigma: 6.0           # step-like level shift > 6σ ⇒ OFFSET
  offset_window_steps: 12          # pre/post median window (2 h at §8.3 cadence)
  quiet_jump_sigma: 3.0            # jumps below this never mask a ramp-like trend
  ramp_ratio_for_drift: 10.0       # |t|/jump above this ⇒ trend is ramp-like (DRIFT), not step-like
  degraded_offset_jump_sigma: 4.0  # mild offset ⇒ DEGRADED (§8.4: flagged, not trusted)
  degraded_drift_score: 2.5        # emerging trend |t| ⇒ DEGRADED
  battery_low_volts: 3.3           # informational floor for the health panel
  rssi_weak_dbm: -100.0            # informational floor for link quality
