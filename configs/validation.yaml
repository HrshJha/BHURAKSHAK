# BhuRakshak — validation-split config 
# All split fractions live here; code never hard-codes them.
#: random row-shuffling across time is explicitly disallowed — the module
# refuses to implement it.

time_split:
  # early → train, middle → validation, late → test (fractions of the span)
  train_upper_fraction: 0.6
  val_upper_fraction: 0.8

spatial_split:
  # sector A: x < 0 → train; sector B: x >= 0 and y < 0 → validation;
  # sector C: x >= 0 and y >= 0 → test (fractions of the quadrant extents)
  boundary_fraction_x: 0.5
  boundary_fraction_y: 0.5

node_split:
  # example: nodes 1–15 → train, nodes 16–20 → test (fractions of the
  # node-id-ordered list; middle slice is validation)
  train_upper_fraction: 0.75
  val_upper_fraction: 0.875

event_split:
  #: train on slow deformation, test on accelerating deformation.
  # Families are matched by substring against the event's scenario family.
  train_families: ["stable", "slow", "vibration", "temperature", "packet", "sensor", "communication", "single_node", "multiple"]
  test_families: ["accelerating", "rapid", "irregular"]
  # validation draws from the train-side families at this fraction of events
  validation_fraction: 0.2

regime_split:
  # unseen-parameter-regime holdout (fixall Phase 1.2): the TEST split is
  # whole scenario REGIMES the model never sees in train/validation — the two
  # growth regimes (rapid, accelerating) and the no-deformation regime
  # (stable). stable_ground is included so P(NORMAL) has held-out support;
  # this makes the operational test harder and more honest, not easier.
  # Validation is a deterministic 1-in-N sample WITHIN each remaining family,
  # so every class keeps validation support. Both the regime holdout and the
  # legacy family-balanced 60/20/20 are produced by scripts/make_split_assignment.py.
  test_families: ["E_rapid_subsidence", "E_accelerating_subsidence", "E_stable_ground"]
  validation_fraction: 0.2

synthetic_split:
  # example: train σ=5–20, test σ=22–30 → hold out the TOP fraction of the
  # subsidence-magnitude range (a complete parameter regime, never sampled in
  # training) plus a middle slice for validation.
  test_upper_fraction: 0.2
  val_upper_fraction: 0.6
